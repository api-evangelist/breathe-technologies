name: Breathe Technologies
description: 'Breathe Technologies, Inc. is a California-based medical device company that develops
  wearable and continuous ventilation systems for patients with chronic respiratory insufficiency
  and neuromuscular disease. Its flagship Life2000 Ventilation System is an FDA-cleared, ultra-lightweight
  ventilator that adapts from a stationary compressor to a wearable device, supporting both acute
  and chronic respiratory failure in home and institutional settings. Breathe Technologies is a
  Kleiner Perkins portfolio company and is now part of the Hillrom family (acquired by Baxter),
  with the Life2000 system distributed under Baxter respiratory care. This is a hardware medical
  device manufacturer with no public developer, API, or programmatic integration surface.'
